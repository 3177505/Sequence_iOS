<div id="app" class="app app--baseline app--exhibit-single app--fullscreen-kiosk">
  <div class="grid">
    <div id="pane-single" class="pane pane--reddit" aria-label="Exhibit images">
      <div class="pane-layer">
        <img class="pane__media is-hidden" data-layer="0" alt="" decoding="async" />
      </div>
      <div class="pane-layer">
        <img class="pane__media is-hidden" data-layer="1" alt="" decoding="async" />
      </div>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="trigger">Spustit (15 s alternativní sekvence)</button>
    <button type="button" id="serial-connect">Připojit senzor (USB serial)</button>
    <span id="status" class="status"></span>
  </div>
</div>
